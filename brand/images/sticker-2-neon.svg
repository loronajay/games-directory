<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Monoton&amp;display=swap');
    </style>
    <radialGradient id="bg2" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#1a0040"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="sunG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff00aa"/>
      <stop offset="60%" stop-color="#7700ff"/>
      <stop offset="100%" stop-color="#7700ff00"/>
    </linearGradient>
    <linearGradient id="stripeG2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00000000"/>
      <stop offset="35%" stop-color="#ff00aa"/>
      <stop offset="65%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#00000000"/>
    </linearGradient>
    <clipPath id="boardClip2">
      <rect width="520" height="520" rx="60"/>
    </clipPath>
    <clipPath id="sunClip2">
      <ellipse cx="260" cy="370" rx="95" ry="95"/>
    </clipPath>
    <mask id="gridMask2">
      <linearGradient id="gm2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="black"/>
        <stop offset="100%" stop-color="white"/>
      </linearGradient>
      <rect width="520" height="520" fill="url(#gm2)"/>
    </mask>
    <filter id="glowPink2" x="-25%" y="-30%" width="150%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan2" x="-12%" y="-15%" width="124%" height="130%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowViolet2" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sunGlow2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- White sticker border -->
  <rect width="520" height="520" rx="60" fill="#ffffff"/>
  <rect x="12" y="12" width="496" height="496" rx="52" fill="#000000"/>
  <rect x="12" y="12" width="496" height="496" rx="52" fill="url(#bg2)"/>

  <!-- Grid floor -->
  <g clip-path="url(#boardClip2)" mask="url(#gridMask2)" opacity="0.5">
    <line x1="0" y1="430" x2="520" y2="430" stroke="#00f5ff" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="455" x2="520" y2="455" stroke="#00f5ff" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="478" x2="520" y2="478" stroke="#00f5ff" stroke-width="1" opacity="0.4"/>
    <line x1="260" y1="420" x2="0"   y2="520" stroke="#00f5ff" stroke-width="0.8" opacity="0.3"/>
    <line x1="260" y1="420" x2="65"  y2="520" stroke="#00f5ff" stroke-width="0.8" opacity="0.3"/>
    <line x1="260" y1="420" x2="130" y2="520" stroke="#00f5ff" stroke-width="0.8" opacity="0.3"/>
    <line x1="260" y1="420" x2="195" y2="520" stroke="#00f5ff" stroke-width="0.8" opacity="0.3"/>
    <line x1="260" y1="420" x2="260" y2="520" stroke="#00f5ff" stroke-width="1"   opacity="0.45"/>
    <line x1="260" y1="420" x2="325" y2="520" stroke="#00f5ff" stroke-width="0.8" opacity="0.3"/>
    <line x1="260" y1="420" x2="390" y2="520" stroke="#00f5ff" stroke-width="0.8" opacity="0.3"/>
    <line x1="260" y1="420" x2="455" y2="520" stroke="#00f5ff" stroke-width="0.8" opacity="0.3"/>
    <line x1="260" y1="420" x2="520" y2="520" stroke="#00f5ff" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Sun -->
  <g filter="url(#sunGlow2)" clip-path="url(#boardClip2)">
    <ellipse cx="260" cy="372" rx="95" ry="95" fill="url(#sunG2)" clip-path="url(#sunClip2)"/>
  </g>
  <!-- Sun stripes -->
  <rect x="165" y="352" width="190" height="5" fill="#000"/>
  <rect x="165" y="364" width="190" height="5" fill="#000"/>
  <rect x="165" y="376" width="190" height="5" fill="#000"/>

  <!-- JAY -->
  <text x="260" y="112" text-anchor="middle"
    font-family="'Monoton', cursive" font-size="26"
    fill="#ff00aa" letter-spacing="10" filter="url(#glowPink2)">JAY</text>

  <!-- ARCADE -->
  <text x="260" y="268" text-anchor="middle"
    font-family="'Monoton', cursive" font-size="82"
    fill="#00f5ff" letter-spacing="4" filter="url(#glowCyan2)">ARCADE</text>

  <!-- Stripe -->
  <rect x="80" y="288" width="360" height="1.5" fill="url(#stripeG2)" filter="url(#glowPink2)"/>

  <!-- Tagline -->
  <text x="260" y="314" text-anchor="middle"
    font-family="'Press Start 2P', monospace" font-size="7"
    fill="#7700ff" letter-spacing="3" filter="url(#glowViolet2)">PLAY · COMPETE · EARN REWARDS</text>

  <!-- URL -->
  <text x="260" y="488" text-anchor="middle"
    font-family="'Press Start 2P', monospace" font-size="9"
    fill="#00f5ff" letter-spacing="3"
    filter="url(#glowCyan2)">jayarcade.com</text>
</svg>
