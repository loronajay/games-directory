<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Bungee+Shade&amp;display=swap');
    </style>
    <!-- Gradients -->
    <linearGradient id="sunGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="40%" stop-color="#ff6a00"/>
      <stop offset="75%" stop-color="#ff2d78"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="arcadeGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="20%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff2d78"/>
    </linearGradient>
    <linearGradient id="stripeGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="25%" stop-color="#b400ff"/>
      <stop offset="50%" stop-color="#00f5ff"/>
      <stop offset="75%" stop-color="#ff2d78"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="bgGrad1" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1a003a"/>
      <stop offset="100%" stop-color="#06020f"/>
    </linearGradient>
    <!-- Glow filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowArcade" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sunGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sunClip1">
      <ellipse cx="350" cy="252" rx="70" ry="70"/>
    </clipPath>
    <mask id="gridMask1">
      <linearGradient id="gmg1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="black"/>
        <stop offset="100%" stop-color="white"/>
      </linearGradient>
      <rect width="700" height="320" fill="url(#gmg1)"/>
    </mask>
  </defs>

  <!-- Dark background -->
  <rect width="700" height="320" fill="url(#bgGrad1)" rx="4"/>

  <!-- Grid floor -->
  <g mask="url(#gridMask1)" opacity="0.5">
    <!-- Vertical lines -->
    <line x1="0" y1="270" x2="700" y2="270" stroke="#9000ff" stroke-width="0.8" opacity="0.4"/>
    <line x1="0" y1="290" x2="700" y2="290" stroke="#9000ff" stroke-width="0.8" opacity="0.4"/>
    <line x1="0" y1="308" x2="700" y2="308" stroke="#9000ff" stroke-width="0.8" opacity="0.4"/>
    <line x1="175" y1="265" x2="0" y2="320" stroke="#9000ff" stroke-width="0.8" opacity="0.35"/>
    <line x1="219" y1="265" x2="105" y2="320" stroke="#9000ff" stroke-width="0.8" opacity="0.35"/>
    <line x1="263" y1="265" x2="210" y2="320" stroke="#9000ff" stroke-width="0.8" opacity="0.35"/>
    <line x1="307" y1="265" x2="315" y2="320" stroke="#9000ff" stroke-width="0.8" opacity="0.35"/>
    <line x1="350" y1="265" x2="350" y2="320" stroke="#9000ff" stroke-width="1" opacity="0.5"/>
    <line x1="393" y1="265" x2="385" y2="320" stroke="#9000ff" stroke-width="0.8" opacity="0.35"/>
    <line x1="437" y1="265" x2="490" y2="320" stroke="#9000ff" stroke-width="0.8" opacity="0.35"/>
    <line x1="481" y1="265" x2="595" y2="320" stroke="#9000ff" stroke-width="0.8" opacity="0.35"/>
    <line x1="525" y1="265" x2="700" y2="320" stroke="#9000ff" stroke-width="0.8" opacity="0.35"/>
  </g>

  <!-- Sun -->
  <g filter="url(#sunGlow)">
    <ellipse cx="350" cy="264" rx="70" ry="70" fill="url(#sunGrad1)" clip-path="url(#sunClip1)"/>
  </g>
  <!-- Sun stripes -->
  <rect x="280" y="248" width="140" height="4" fill="#06020f"/>
  <rect x="280" y="257" width="140" height="4" fill="#06020f"/>
  <rect x="280" y="266" width="140" height="4" fill="#06020f"/>

  <!-- JAY -->
  <text x="350" y="80" text-anchor="middle"
    font-family="'Press Start 2P', monospace" font-size="13" fill="#00f5ff"
    letter-spacing="20" filter="url(#glowCyan)">JAY</text>

  <!-- ARCADE -->
  <text x="350" y="200" text-anchor="middle"
    font-family="'Bungee Shade', cursive" font-size="130" fill="url(#arcadeGrad1)"
    letter-spacing="6" filter="url(#glowArcade)">ARCADE</text>

  <!-- Stripe -->
  <rect x="105" y="218" width="490" height="2" fill="url(#stripeGrad1)" filter="url(#glowPurple)"/>

  <!-- Tagline -->
  <text x="350" y="240" text-anchor="middle"
    font-family="'Press Start 2P', monospace" font-size="7" fill="#b400ff"
    letter-spacing="5" filter="url(#glowPurple)">PLAY · COMPETE · EARN REWARDS</text>
</svg>
