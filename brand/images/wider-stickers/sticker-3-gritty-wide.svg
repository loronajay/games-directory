<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Black+Ops+One&amp;display=swap');
    </style>
    <linearGradient id="sunG3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="55%" stop-color="#ff3300"/>
      <stop offset="90%" stop-color="#cc0066"/>
      <stop offset="100%" stop-color="#cc006600"/>
    </linearGradient>
    <linearGradient id="arcadeG3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ff9900"/>
      <stop offset="65%" stop-color="#ff3300"/>
      <stop offset="100%" stop-color="#cc0066"/>
    </linearGradient>
    <linearGradient id="stripeG3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#02000800"/>
      <stop offset="20%" stop-color="#ff3300"/>
      <stop offset="50%" stop-color="#ff9900"/>
      <stop offset="80%" stop-color="#cc0066"/>
      <stop offset="100%" stop-color="#02000800"/>
    </linearGradient>
    <clipPath id="boardClip3"><rect x="12" y="12" width="776" height="376" rx="44"/></clipPath>
    <clipPath id="sunClip3"><ellipse cx="400" cy="328" rx="95" ry="95"/></clipPath>
    <mask id="gridMask3">
      <linearGradient id="gm3" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="black"/>
        <stop offset="100%" stop-color="white"/>
      </linearGradient>
      <rect width="800" height="400" fill="url(#gm3)"/>
    </mask>
    <filter id="glowOrange3" x="-25%" y="-30%" width="150%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowArcade3" x="-8%" y="-15%" width="116%" height="130%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed3" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sunGlow3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- White sticker border -->
  <rect width="800" height="400" rx="50" fill="#ffffff"/>
  <!-- Inner background -->
  <rect x="12" y="12" width="776" height="376" rx="42" fill="#020008"/>

  <!-- Grid floor -->
  <g clip-path="url(#boardClip3)" mask="url(#gridMask3)" opacity="0.55">
    <line x1="0" y1="320" x2="800" y2="320" stroke="#ff3300" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="346" x2="800" y2="346" stroke="#ff3300" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="370" x2="800" y2="370" stroke="#ff3300" stroke-width="1" opacity="0.4"/>
    <line x1="400" y1="312" x2="12"  y2="400" stroke="#ff3300" stroke-width="0.8" opacity="0.3"/>
    <line x1="400" y1="312" x2="100" y2="400" stroke="#ff3300" stroke-width="0.8" opacity="0.3"/>
    <line x1="400" y1="312" x2="188" y2="400" stroke="#ff3300" stroke-width="0.8" opacity="0.3"/>
    <line x1="400" y1="312" x2="276" y2="400" stroke="#ff3300" stroke-width="0.8" opacity="0.3"/>
    <line x1="400" y1="312" x2="364" y2="400" stroke="#ff3300" stroke-width="0.8" opacity="0.3"/>
    <line x1="400" y1="312" x2="400" y2="400" stroke="#ff3300" stroke-width="1"   opacity="0.45"/>
    <line x1="400" y1="312" x2="436" y2="400" stroke="#ff3300" stroke-width="0.8" opacity="0.3"/>
    <line x1="400" y1="312" x2="524" y2="400" stroke="#ff3300" stroke-width="0.8" opacity="0.3"/>
    <line x1="400" y1="312" x2="612" y2="400" stroke="#ff3300" stroke-width="0.8" opacity="0.3"/>
    <line x1="400" y1="312" x2="700" y2="400" stroke="#ff3300" stroke-width="0.8" opacity="0.3"/>
    <line x1="400" y1="312" x2="788" y2="400" stroke="#ff3300" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Sun -->
  <g filter="url(#sunGlow3)" clip-path="url(#boardClip3)">
    <ellipse cx="400" cy="330" rx="95" ry="95" fill="url(#sunG3)" clip-path="url(#sunClip3)"/>
  </g>
  <!-- Sun stripes -->
  <rect x="305" y="312" width="190" height="5" fill="#020008"/>
  <rect x="305" y="323" width="190" height="5" fill="#020008"/>
  <rect x="305" y="334" width="190" height="5" fill="#020008"/>

  <!-- JAY -->
  <text x="400" y="88" text-anchor="middle"
    font-family="'Press Start 2P', monospace" font-size="14"
    fill="#ff9900" letter-spacing="22" filter="url(#glowOrange3)">JAY</text>

  <!-- ARCADE -->
  <text x="400" y="224" text-anchor="middle"
    font-family="'Black Ops One', cursive" font-size="152"
    fill="url(#arcadeG3)" letter-spacing="4" filter="url(#glowArcade3)">ARCADE</text>

  <!-- Stripe -->
  <rect x="100" y="242" width="600" height="2" fill="url(#stripeG3)" filter="url(#glowRed3)"/>

  <!-- Tagline -->
  <text x="400" y="266" text-anchor="middle"
    font-family="'Press Start 2P', monospace" font-size="8"
    fill="#cc0066" letter-spacing="5" filter="url(#glowRed3)">PLAY · COMPETE · EARN REWARDS</text>

  <!-- URL -->
  <text x="400" y="372" text-anchor="middle"
    font-family="'Press Start 2P', monospace" font-size="10"
    fill="#ff9900" letter-spacing="3" filter="url(#glowOrange3)">jayarcade.com</text>
</svg>
